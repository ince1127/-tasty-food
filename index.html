<meta name="viewport" content="width=device-width, initial-scale=1">
<title>油廠好食光</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#EFEADD;
    --ink:#262119; --ink-soft:#5B5346; --muted:#8A8172; --border:#E3DBC9;
    --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#E1F0EB;
    --amber:#A6650F; --amber-soft:#F8EAD2;
    --danger:#AD3327; --danger-soft:#FBE7E4;
    --success:#2E7D4F; --success-soft:#E4F3E9;
    --shadow:0 1px 2px rgba(38,33,25,.06), 0 10px 28px -14px rgba(38,33,25,.22);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans TC',system-ui,sans-serif; line-height:1.55; margin:0;}
  #app{max-width:1040px; margin:0 auto; padding:28px 20px 80px;}
  h1,h2,h3{font-family:'Noto Serif TC',serif; margin:0;}
  table{border-collapse:collapse; width:100%;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font:inherit; cursor:pointer;}
  input,textarea,select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:8px 10px;}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .header{margin-bottom:22px;}
  .eyebrow{font-size:12.5px; letter-spacing:.08em; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:6px;}
  .title{font-size:clamp(24px,3.4vw,32px); font-weight:700;}
  .subtitle{color:var(--ink-soft); margin-top:6px; font-size:14.5px; max-width:640px;}

  .summary-bar{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;}
  .summary-stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; box-shadow:var(--shadow); min-width:132px;}
  .summary-stat .num-big{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  .summary-stat .lbl{font-size:12.5px; color:var(--muted);}

  .readonly-banner{background:var(--amber-soft); border:1px solid var(--amber); color:var(--ink); border-radius:10px; padding:10px 14px; font-size:13.5px; margin-top:16px;}
  .deadline-banner{border-radius:10px; padding:10px 14px; font-size:13.5px; margin-top:16px; font-weight:700;}
  .deadline-banner.open{background:var(--accent-soft); border:1px solid var(--accent); color:var(--ink);}
  .deadline-banner.closed{background:var(--danger-soft); border:1px solid var(--danger); color:var(--ink);}

  .section{margin-top:36px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .section-title{font-size:19px; font-weight:700;}
  .section-hint{color:var(--muted); font-size:13px;}

  .today-pick-banner{background:var(--accent-soft); border:1px solid var(--accent); color:var(--ink); border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:14px; font-weight:700;}
  .store-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px;}
  .store-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; gap:14px; position:relative;}
  .store-card[data-color="amber"]{border-top:4px solid var(--amber);}
  .store-card[data-color="teal"]{border-top:4px solid var(--accent);}
  .store-card.today-pick{box-shadow:0 0 0 3px var(--accent-soft), var(--shadow);}
  .today-pick-badge{position:absolute; top:-12px; left:16px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px;}
  .pill.amber{background:var(--amber-soft); color:var(--amber);}
  .pill.teal{background:var(--accent-soft); color:var(--accent);}
  .store-name{font-size:19px; font-weight:700; margin-top:6px;}
  .meta-list{display:flex; flex-direction:column; gap:6px; font-size:13.5px; color:var(--ink-soft);}
  .meta-row{display:flex; gap:7px; align-items:flex-start;}
  .meta-row .ico{flex:none; width:18px; text-align:center;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
  .chip{display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border-radius:8px; padding:4px 9px; font-size:12.5px; color:var(--ink-soft); text-decoration:none;}
  .chip:hover{background:var(--border);}
  .note-box{border-radius:10px; padding:10px 12px; font-size:12.8px; line-height:1.6;}
  .note-box.amber{background:var(--amber-soft); color:var(--ink);}
  .note-box.teal{background:var(--accent-soft); color:var(--ink);}

  .menu-table th{text-align:left; font-size:12px; color:var(--muted); font-weight:700; padding:0 6px 6px; border-bottom:1px solid var(--border);}
  .menu-table td{padding:8px 6px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:middle;}
  .menu-table tr:last-child td{border-bottom:none;}
  .menu-table .price-col{text-align:right; white-space:nowrap;}
  .menu-table .qty-col{text-align:center; white-space:nowrap;}
  .menu-table .sub-col{text-align:right; white-space:nowrap; color:var(--ink-soft);}
  .stepper{display:inline-flex; align-items:center; gap:6px;}
  .stepper button{width:26px; height:26px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-weight:700; line-height:1;}
  .stepper button:hover{background:var(--border);}
  .stepper .qty-val{min-width:22px; text-align:center; font-variant-numeric:tabular-nums;}
  .store-subtotal{text-align:right; font-size:13.5px; color:var(--ink-soft); padding-top:2px;}
  .store-subtotal b{color:var(--ink); font-variant-numeric:tabular-nums;}

  .cart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px;}
  .cart-empty{color:var(--muted); font-size:14px; padding:12px 0;}
  .cart-group{margin-bottom:14px;}
  .cart-group-title{font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .cart-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; font-size:14px; border-bottom:1px dashed var(--border);}
  .cart-item .name{flex:1;}
  .cart-item .amt{font-variant-numeric:tabular-nums; color:var(--ink-soft); white-space:nowrap;}
  .cart-total-row{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:12px; border-top:1px solid var(--border);}
  .cart-total-row .grand{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  .cart-form{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .cart-form .full{grid-column:1/-1;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input,.field textarea{width:100%;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:10px 18px; font-weight:700; font-size:14px; border:1px solid transparent;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--danger-soft); color:var(--danger); border-color:transparent;}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-small{padding:6px 11px; font-size:12.5px; border-radius:8px;}

  .totals-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;}
  .totals-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .totals-card h3{font-size:15.5px; margin-bottom:10px;}
  .totals-table td{padding:5px 0; font-size:13.8px; border-bottom:1px dashed var(--border);}
  .totals-table td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
  .totals-store-total{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-weight:700;}
  .grand-total-card{background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--radius); padding:18px 20px; display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
  .grand-total-card .lbl{font-weight:700;}
  .grand-total-card .val{font-size:24px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}

  .orders-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .orders-table{min-width:640px;}
  .orders-table th{text-align:left; font-size:12px; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .orders-table td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:top;}
  .orders-table tr:last-child td{border-bottom:none;}
  .orders-empty{padding:24px; text-align:center; color:var(--muted); font-size:14px;}

  .admin-bar{display:flex; justify-content:flex-end; margin-top:40px;}
  .admin-link{font-size:12.5px; color:var(--muted); background:none; border:none; text-decoration:underline; padding:4px;}
  .admin-panel{background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius); padding:20px; margin-top:12px;}
  .admin-panel h3{font-size:15px; margin-bottom:10px;}
  .admin-login{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;}
  .row-list{display:flex; flex-direction:column; gap:8px; margin:8px 0;}
  .row-list-item{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .row-list-item input,.row-list-item select{flex:1; min-width:90px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .form-grid .full{grid-column:1/-1;}
  .admin-store-block{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px;}
  .admin-store-block summary{cursor:pointer; font-weight:700; font-size:14px;}
  .confirm-inline{display:inline-flex; gap:6px; align-items:center; background:var(--danger-soft); padding:4px 8px; border-radius:8px;}
  .divider{height:1px; background:var(--border); margin:16px 0;}
  .muted{color:var(--muted); font-size:12.8px;}
  .item-edit-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--surface-2); padding:6px 8px; border-radius:8px;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer.foot{margin-top:48px; padding-top:18px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); text-align:center;}

  @media (max-width:560px){
    .cart-form{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>

  var config = null;          // 從後台載入的設定（店家/菜單/密碼/結單時間），null = 尚未載入完成

  var ordersLoadError = '';

  var draft = {};        // { storeId: { itemName: qty } }  -- local only
  var isAdmin = false;   // false | 'pending' | true
  var adminScreen = false;
  var newStoreForm = null;
  var editingItem = null;
  var editingStoreInfo = null; // { id: storeId, form: {...} } | null
  var confirmTarget = null;

  function fmt(n){ return '$' + new Intl.NumberFormat('zh-Hant-TW').format(n||0); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function isOrderingClosed(){
    if(!config || !config.deadline) return false;
    return Date.now() >= new Date(config.deadline).getTime();
  }
  function formatDeadline(d){
    var weekdays = ['日','一','二','三','四','五','六'];
    var mm = d.getMonth()+1, dd = d.getDate();
    var hh = String(d.getHours()).padStart(2,'0'), mi = String(d.getMinutes()).padStart(2,'0');
    return mm+'/'+dd+'（週'+weekdays[d.getDay()]+'）'+hh+':'+mi;
  }
  function toLocalInputValue(iso){
    var d = new Date(iso);
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 3400);
  }

  function findStore(id){ return config && config.stores.find(function(s){ return s.id===id; }); }

  function draftQty(storeId, itemName){
    return (draft[storeId] && draft[storeId][itemName]) || 0;
  }
  function setDraftQty(storeId, itemName, qty){
    if(!draft[storeId]) draft[storeId] = {};
    qty = Math.max(0, qty);
    if(qty===0){ delete draft[storeId][itemName]; }
    else { draft[storeId][itemName] = qty; }
    render();
  }

  function cartLines(){
    var lines = [];
    Object.keys(draft).forEach(function(storeId){
      var store = findStore(storeId);
      if(!store) return;
      Object.keys(draft[storeId]).forEach(function(itemName){
        var qty = draft[storeId][itemName];
        if(qty<=0) return;
        var item = store.menu.find(function(m){ return m.name===itemName; });
        if(!item) return;
        lines.push({ storeId: storeId, storeName: store.name, name: itemName, price: item.price, qty: qty, amount: item.price*qty });
      });
    });
    return lines;
  }
  function cartTotal(){ return cartLines().reduce(function(a,l){ return a+l.amount; }, 0); }

  // ---------- 後台呼叫（一般 fetch，不受 Claude Artifact 的限制）----------
  function apiGet(params){
    var qs = Object.keys(params||{}).map(function(k){ return encodeURIComponent(k)+'='+encodeURIComponent(params[k]); }).join('&');
    var url = APPS_SCRIPT_URL + (qs ? '?' + qs : '');
    return fetch(url, { method:'GET' }).then(function(res){
      if(!res.ok) throw { code:'http_error', status: res.status };
      return res.json();
    });
  }
  function apiPost(payload){
    return fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免觸發 CORS 預檢請求

  // ---------- 批次貼上「店家資訊」（地址／電話／營業時間等，非菜單）----------
  // 格式：一行一個欄位，「欄位名稱: 內容」；電話／LINE／FB／IG／營業 可重複多行。
  var STORE_INFO_CONTACT_KEYS = { '電話':'phone', 'LINE':'line', 'FB':'fb', 'FACEBOOK':'fb', 'IG':'ig', 'INSTAGRAM':'ig', '其他':'other', '聯絡':'other' };
  function parseStoreInfoText(text){
    var lines = String(text||'').split(/\r?\n/);
    var out = { name:null, tag:null, color:null, address:null, addressNote:null, mapUrl:null, closedNote:null, orderNote:null, contacts:[], hours:[] };
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      var m = line.match(/^([^:：]+)[:：]\s*(.*)$/);
      if(!m) return;
      var key = m[1].trim();
      var val = m[2].trim();
      if(!val) return;
      var contactType = STORE_INFO_CONTACT_KEYS[key] || STORE_INFO_CONTACT_KEYS[key.toUpperCase()];
      if(key==='店名'){ out.name = val; }
      else if(key==='分類'){ out.tag = val; }
      else if(key==='配色'){ out.color = (val==='青綠' || val.toLowerCase()==='teal') ? 'teal' : 'amber'; }
      else if(key==='地址'){ out.address = val; }
      else if(key==='地址備註'){ out.addressNote = val; }
      else if(key==='地圖連結'){ out.mapUrl = val; }
      else if(key==='公休備註'){ out.closedNote = val; }
      else if(key==='訂購提醒'){ out.orderNote = val; }
      else if(key==='營業'){
        var hp = val.split(/,|，/);
        out.hours.push({ days:(hp[0]||'').trim(), time:(hp.slice(1).join(',')||'').trim() });
      } else if(contactType){
        var cp = val.split(/,|，/);
        var label, value;
        if(cp.length>=2){ label = cp[0].trim(); value = cp.slice(1).join(',').trim(); }
        else { label=''; value = cp[0].trim(); }
        out.contacts.push({ type:contactType, label:label, value:value });
      }
    });
    return out;
  }

  function parseMenuLines(text){
    var lines = String(text||'').split(/\r?\n/);
    var items = [];
    var skipped = 0;
    lines.forEach(function(line){
      line = line.trim();
      if(!line) return;
      var parts = line.split(/,|，|\t/);
      var name = (parts[0]||'').trim();
      var price = Number((parts[1]||'').trim());
      if(!name || !price || isNaN(price) || price<=0){ skipped++; return; }
      items.push({ name:name, price:price });
    });
    return { items: items, skipped: skipped };
  }

  function renderCart(){
    var closedNow = isOrderingClosed();
    var lines = cartLines();
    var byStore = {};
    lines.forEach(function(l){ (byStore[l.storeId] = byStore[l.storeId]||[]).push(l); });
    var groupsHtml = Object.keys(byStore).map(function(storeId){
      var store = findStore(storeId);
      var itemsHtml = byStore[storeId].map(function(l){
        return '<div class="cart-item"><span class="name">'+esc(l.name)+' × '+l.qty+'</span><span class="amt num">'+fmt(l.amount)+'</span></div>';
      }).join('');
      return '<div class="cart-group"><div class="cart-group-title">'+esc(store?store.name:storeId)+'</div>'+itemsHtml+'</div>';
    }).join('');

    var body;
    if(closedNow){
      body = '<div class="cart-empty">🔒 本輪已截止收單，無法再登記訂購。如有需要請洽研發組是否開放下一輪。</div>';
    } else if(lines.length===0){
      body = '<div class="cart-empty">尚未選擇任何品項 — 請於上方店家菜單點選份數，再於下方填寫姓名送出。</div>';

      '<div class="cart-form">' +

  function renderTotals(){
    var orders = getOrders();
    var cards = config.stores.map(function(store){
      var tally = {};
      orders.forEach(function(o){
        o.items.forEach(function(it){ if(it.storeId===store.id) tally[it.name]=(tally[it.name]||0)+it.qty; });
      });
      var names = Object.keys(tally);
      var storeTotal = 0;
      var rows = names.map(function(n){
        var item = store.menu.find(function(m){ return m.name===n; });
        var price = item?item.price:0;
        var amt = price*tally[n];
        storeTotal += amt;
        return '<tr><td>'+esc(n)+' × '+tally[n]+'</td><td class="num">'+fmt(amt)+'</td></tr>';
      }).join('');
      return '' +
      '<div class="totals-card">' +
        '<h3>'+esc(store.name)+'</h3>' +
        (names.length===0
          ? '<div class="muted">尚無人登記訂購。</div>'
          : '<table class="totals-table">'+rows+'</table><div class="totals-store-total"><span>店家小計</span><span class="num">'+fmt(storeTotal)+'</span></div>') +
        '<div style="margin-top:12px;"><button type="button" class="btn btn-ghost btn-small" data-action="copy-store" data-store="'+store.id+'">📋 複製此店訂購清單文字</button></div>' +
      '</div>';
    }).join('');

    var grand = orders.reduce(function(a,o){ return a+o.total; }, 0);

    return '' +
    '<div class="section">' +
      '<div class="section-head"><div class="section-title">團購總表</div><div class="section-hint">依店家彙整數量與金額，可複製文字傳給店家</div></div>' +
      '<div class="totals-grid">' + cards + '</div>' +
      '<div class="grand-total-card"><span class="lbl">全部店家合計</span><span class="val num">'+fmt(grand)+'</span></div>' +
    '</div>';
  }

  function copyStoreOrderText(storeId){
    var store = findStore(storeId);
    if(!store) return;
    var tally = {};
    getOrders().forEach(function(o){
      o.items.forEach(function(it){
        if(it.storeId!==storeId) return;
        tally[it.name] = (tally[it.name]||0) + it.qty;
      });
    });
    var names = Object.keys(tally);
    var lines = ['【' + store.name + '】團購訂購清單'];
    var totalQty = 0, totalAmt = 0;
    if(names.length===0){
      lines.push('（目前尚無人登記訂購）');
    } else {
      names.forEach(function(n){
        var item = store.menu.find(function(m){ return m.name===n; });
        var price = item ? item.price : 0;
        var qty = tally[n];
        totalQty += qty; totalAmt += price*qty;
        lines.push(n + ' x ' + qty + (item ? '（' + fmt(price*qty) + '）' : ''));
      });
      lines.push('共 ' + totalQty + ' 份，合計 ' + fmt(totalAmt));
    }
    var text = lines.join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('已複製「' + store.name + '」訂購清單，可直接貼到 LINE 傳給店家。');
      }).catch(function(){
        showToast('複製失敗，請手動選取文字複製。');
      });
    } else {
      showToast('此瀏覽器不支援自動複製，請手動選取文字。');
    }
  }

  // ---------- admin: export orders to Excel ----------
  function exportTimestamp(d){
    d = d || new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes());
  }
  function contactsText(store){
    var labelMap = {phone:'電話', line:'LINE', fb:'Facebook', ig:'Instagram', other:'聯絡'};
    return store.contacts.map(function(c){
      var label = labelMap[c.type] || '聯絡';
      var tag = (c.label && c.label!==label) ? (label+'／'+c.label) : label;
      return tag + '：' + c.value;
    }).join('；');
  }
  function hoursText(store){
    return store.hours.map(function(h){ return h.days+' '+h.time; }).join('；');
  }

  function buildOrdersWorkbook(){
    var orders = getOrders();
    var wb = XLSX.utils.book_new();
    var totalPeople = orders.length;
    var totalItems = orders.reduce(function(a,o){ return a + o.items.reduce(function(b,i){ return b+i.qty; },0); }, 0);
    var totalAmt = orders.reduce(function(a,o){ return a+o.total; }, 0);
    var deadlineText = config.deadline ? formatDeadline(new Date(config.deadline)) : '未設定';

    var summaryRows = [
      ['油廠好食光 — 團購訂單摘要'],
      [],
      ['結單時間', deadlineText],
      ['匯出時間', formatDeadline(new Date())],
      ['已登記人數', totalPeople],
      ['已登記份數', totalItems],
      ['總金額', totalAmt]
    ];
    var wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
    wsSummary['!cols'] = [{wch:16},{wch:26}];
    XLSX.utils.book_append_sheet(wb, wsSummary, '訂單摘要');

    var storeHeader = ['店名','分類','地址','地址備註','聯絡方式','營業時間','公休／備註','訂購提醒','Google地圖連結'];
    var storeRows = config.stores.map(function(s){
      return [s.name, s.tag, s.address, s.addressNote, contactsText(s), hoursText(s), s.closedNote, s.orderNote, s.mapUrl];
    });
    var wsStores = XLSX.utils.aoa_to_sheet([storeHeader].concat(storeRows));
    wsStores['!cols'] = [{wch:20},{wch:10},{wch:26},{wch:20},{wch:34},{wch:20},{wch:14},{wch:36},{wch:40}];
    XLSX.utils.book_append_sheet(wb, wsStores, '店家聯絡資訊');

    var orderHeader = ['訂購人','店家','品項','單價','數量','小計','備註','送出時間'];
    var orderRows = [];
    orders.forEach(function(o){
      var t = new Date(o.submittedAt);
      o.items.forEach(function(it){
        orderRows.push([o.name, it.storeName, it.name, it.price, it.qty, it.price*it.qty, o.note||'', formatDeadline(t)]);
      });
    });
    var wsOrders = XLSX.utils.aoa_to_sheet([orderHeader].concat(orderRows));
    wsOrders['!cols'] = [{wch:12},{wch:20},{wch:14},{wch:8},{wch:6},{wch:8},{wch:20},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsOrders, '訂購明細');

    var sumHeader = ['店家','品項','數量','金額'];
    var sumRows = [];
    config.stores.forEach(function(store){
      var tally = {};
      orders.forEach(function(o){
        o.items.forEach(function(it){ if(it.storeId===store.id) tally[it.name]=(tally[it.name]||0)+it.qty; });
      });
      var names = Object.keys(tally);
      if(names.length===0) return;
      var storeTotal = 0;
      names.forEach(function(n){
        var item = store.menu.find(function(m){ return m.name===n; });
        var price = item?item.price:0;
        var amt = price*tally[n];
        storeTotal += amt;
        sumRows.push([store.name, n+' × '+tally[n], tally[n], amt]);
      });
      sumRows.push([store.name+' 小計', '', '', storeTotal]);
      sumRows.push([]);
    });
    sumRows.push(['全部店家合計', '', '', totalAmt]);
    var wsSum = XLSX.utils.aoa_to_sheet([sumHeader].concat(sumRows));
    wsSum['!cols'] = [{wch:20},{wch:24},{wch:8},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsSum, '店家彙總');

    return wb;
  }

  function exportOrdersToExcel(){
    if(typeof XLSX === 'undefined'){ showToast('Excel 匯出元件尚未載入完成，請重新整理頁面後再試一次。'); return; }
    if(getOrders().length===0){ showToast('目前尚無訂購資料可匯出。'); return; }
    try{
      var wb = buildOrdersWorkbook();
      var wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
      var blob = new Blob([wbout], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var fname = '油廠好食光_團購訂單_' + exportTimestamp() + '.xlsx';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('已下載 Excel 檔案，請至瀏覽器下載位置查看。');
    }catch(e){
      showToast('產生 Excel 檔案時發生問題，請再試一次，或改用「複製文字」功能。');
    }
  }

  render();
  loadConfig().then(function(){ refreshOrders(); });
  setInterval(function(){
    if(config && config.deadline && !(isAdmin===true && adminScreen)) render();
  }, 60000);
  setInterval(function(){
    if(!newStoreForm && !editingItem){ refreshOrders(); }
  }, 20000);
})();
</script>
</body>
</html>
